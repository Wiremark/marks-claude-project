<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Running & Jumping Cartoon</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, #87CEEB 0%, #87CEEB 60%, #90EE90 60%, #228B22 100%);
    height: 100vh;
    overflow: hidden;
    font-family: sans-serif;
  }

  /* Sky elements */
  .sun {
    position: absolute;
    top: 40px; right: 120px;
    width: 80px; height: 80px;
    background: #FFD700;
    border-radius: 50%;
    box-shadow: 0 0 30px #FFD700;
  }
  .cloud {
    position: absolute;
    background: white;
    border-radius: 50px;
    opacity: 0.9;
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: white;
    border-radius: 50%;
  }
  .cloud1 { width: 100px; height: 40px; top: 80px; left: -120px; animation: cloudMove 18s linear infinite; }
  .cloud1::before { width: 50px; height: 50px; top: -25px; left: 15px; }
  .cloud1::after  { width: 40px; height: 40px; top: -20px; left: 45px; }
  .cloud2 { width: 80px; height: 30px; top: 130px; left: -100px; animation: cloudMove 24s linear infinite 6s; }
  .cloud2::before { width: 40px; height: 40px; top: -20px; left: 10px; }
  .cloud2::after  { width: 30px; height: 30px; top: -15px; left: 38px; }
  @keyframes cloudMove { from { left: -150px; } to { left: 110%; } }

  /* Ground elements */
  .ground-strip {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 40%;
  }
  .grass-blade {
    position: absolute;
    bottom: 100%;
    width: 4px;
    background: #2d8a2d;
    border-radius: 2px 2px 0 0;
    transform-origin: bottom center;
  }

  /* Scene container */
  .scene {
    position: relative;
    width: 100%;
    height: 100vh;
  }

  /* Character */
  .character {
    position: absolute;
    bottom: 40%;
    left: 50%;
    transform: translateX(-50%);
    animation: runJump 2s ease-in-out infinite;
  }

  @keyframes runJump {
    0%   { bottom: 40%; }
    15%  { bottom: 40%; }
    35%  { bottom: 58%; }
    50%  { bottom: 40%; }
    65%  { bottom: 40%; }
    80%  { bottom: 40%; }
    100% { bottom: 40%; }
  }

  /* SVG character parts */
  .char-svg {
    width: 80px;
    height: 140px;
    display: block;
  }

  /* Running legs animation */
  .leg-left  { animation: legLeft  0.5s linear infinite; transform-origin: 40px 80px; }
  .leg-right { animation: legRight 0.5s linear infinite; transform-origin: 40px 80px; }
  .arm-left  { animation: armLeft  0.5s linear infinite; transform-origin: 40px 55px; }
  .arm-right { animation: armRight 0.5s linear infinite; transform-origin: 40px 55px; }

  @keyframes legLeft {
    0%   { transform: rotate(-30deg); }
    25%  { transform: rotate(0deg);   }
    50%  { transform: rotate(35deg);  }
    75%  { transform: rotate(0deg);   }
    100% { transform: rotate(-30deg); }
  }
  @keyframes legRight {
    0%   { transform: rotate(35deg);  }
    25%  { transform: rotate(0deg);   }
    50%  { transform: rotate(-30deg); }
    75%  { transform: rotate(0deg);   }
    100% { transform: rotate(35deg);  }
  }
  @keyframes armLeft {
    0%   { transform: rotate(35deg);  }
    25%  { transform: rotate(0deg);   }
    50%  { transform: rotate(-30deg); }
    75%  { transform: rotate(0deg);   }
    100% { transform: rotate(35deg);  }
  }
  @keyframes armRight {
    0%   { transform: rotate(-30deg); }
    25%  { transform: rotate(0deg);   }
    50%  { transform: rotate(35deg);  }
    75%  { transform: rotate(0deg);   }
    100% { transform: rotate(-30deg); }
  }

  /* Jump pose override — pause limbs mid-jump */
  @keyframes jumpPose {
    0%,49%  { transform: rotate(0deg);  }
    50%,80% { transform: rotate(40deg); }
    81%,100%{ transform: rotate(0deg);  }
  }

  /* Dust puffs */
  .dust {
    position: absolute;
    bottom: 40%;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
  }
  .puff {
    position: absolute;
    border-radius: 50%;
    background: rgba(180,140,90,0.5);
    animation: puff 0.5s ease-out infinite;
  }
  .puff:nth-child(1) { width: 16px; height: 16px; left: -30px; animation-delay: 0s;    }
  .puff:nth-child(2) { width: 12px; height: 12px; left: -8px;  animation-delay: 0.17s; }
  .puff:nth-child(3) { width: 10px; height: 10px; left: 10px;  animation-delay: 0.34s; }

  @keyframes puff {
    0%   { transform: translateY(0)   scale(0.3); opacity: 0.7; }
    100% { transform: translateY(-20px) scale(1.5); opacity: 0; }
  }

  /* Title label */
  .label {
    position: absolute;
    top: 20px; left: 50%;
    transform: translateX(-50%);
    font-size: 1.4rem;
    font-weight: bold;
    color: #fff;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
    letter-spacing: 2px;
  }

  /* Scoreboard */
  .scoreboard {
    position: absolute;
    top: 16px; left: 16px;
    background: rgba(0,0,0,0.55);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 14px;
    padding: 12px 20px;
    color: #fff;
    min-width: 140px;
    backdrop-filter: blur(4px);
  }
  .scoreboard h2 {
    font-size: 0.7rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #FFD700;
    margin-bottom: 8px;
  }
  .score-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 4px 0;
    font-size: 0.85rem;
    gap: 16px;
  }
  .score-row .s-label { color: #adf; font-size: 0.75rem; }
  .score-row .s-value {
    font-size: 1.4rem;
    font-weight: bold;
    font-variant-numeric: tabular-nums;
    color: #fff;
    min-width: 48px;
    text-align: right;
  }
  .score-row .s-value.jumps { color: #7fff7f; }

  /* Stopwatch panel */
  .stopwatch {
    position: absolute;
    top: 16px; right: 16px;
    background: rgba(0,0,0,0.55);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 14px;
    padding: 12px 20px;
    color: #fff;
    min-width: 160px;
    text-align: center;
    backdrop-filter: blur(4px);
  }
  .stopwatch h2 {
    font-size: 0.7rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #FFD700;
    margin-bottom: 8px;
  }
  .sw-display {
    font-size: 2rem;
    font-weight: bold;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    color: #fff;
    margin-bottom: 10px;
  }
  .sw-display .sw-ms {
    font-size: 1.1rem;
    color: #adf;
  }
  .sw-buttons { display: flex; gap: 8px; justify-content: center; }
  .btn {
    border: none;
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 0.85rem;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.1s;
  }
  .btn:active { transform: scale(0.93); }
  .btn-start  { background: #4CAF50; color: #fff; }
  .btn-stop   { background: #e74c3c; color: #fff; }
  .btn-reset  { background: rgba(255,255,255,0.2); color: #fff; }

  /* Paused state — dim animation */
  .paused .character,
  .paused .dust,
  .paused .shadow { animation-play-state: paused !important; }
  .paused .character * { animation-play-state: paused !important; }
  .paused .scroll-obj { animation-play-state: paused !important; }
  .paused .cloud1, .paused .cloud2 { animation-play-state: paused !important; }

  /* Shadow under character */
  .shadow {
    position: absolute;
    bottom: 40%;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    width: 50px; height: 12px;
    background: rgba(0,0,0,0.15);
    border-radius: 50%;
    animation: shadowPulse 2s ease-in-out infinite;
  }
  @keyframes shadowPulse {
    0%,100% { transform: translateX(-50%) translateY(8px) scaleX(1);   opacity: 0.3; }
    35%     { transform: translateX(-50%) translateY(8px) scaleX(0.4); opacity: 0.1; }
    50%     { transform: translateX(-50%) translateY(8px) scaleX(0.3); opacity: 0.05; }
    65%     { transform: translateX(-50%) translateY(8px) scaleX(0.5); opacity: 0.15; }
  }

  /* Scrolling ground line */
  .ground-line {
    position: absolute;
    bottom: 40%;
    left: 0; right: 0;
    height: 4px;
    background: #1a6b1a;
  }

  /* Scrolling objects on ground */
  .scroll-obj {
    position: absolute;
    bottom: 40%;
    animation: scroll 3s linear infinite;
  }
  .rock { width: 18px; height: 12px; background: #888; border-radius: 50% 50% 40% 40%; bottom: 40%; }
  .flower-stem { width: 3px; height: 20px; background: #2d8a2d; }
  .flower-head {
    position: absolute;
    top: -10px; left: -6px;
    width: 15px; height: 15px;
    border-radius: 50%;
    background: #FF69B4;
  }
  .flower-head::after {
    content: '';
    position: absolute;
    top: 3px; left: 3px;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #FFD700;
  }

  @keyframes scroll { from { left: 110%; } to { left: -60px; } }
  .obj1 { animation-duration: 3s;   animation-delay: 0s;   }
  .obj2 { animation-duration: 4s;   animation-delay: 1s;   }
  .obj3 { animation-duration: 3.5s; animation-delay: 2s;   }
  .obj4 { animation-duration: 2.8s; animation-delay: 0.5s; }
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="label">🏃 RUN &amp; JUMP!</div>

  <!-- Scoreboard -->
  <div class="scoreboard">
    <h2>Scoreboard</h2>
    <div class="score-row">
      <span class="s-label">Score</span>
      <span class="s-value" id="score">0</span>
    </div>
    <div class="score-row">
      <span class="s-label">Jumps</span>
      <span class="s-value jumps" id="jumps">0</span>
    </div>
    <div class="score-row">
      <span class="s-label">Best</span>
      <span class="s-value" id="best">0</span>
    </div>
  </div>

  <!-- Stopwatch -->
  <div class="stopwatch">
    <h2>Stopwatch</h2>
    <div class="sw-display">
      <span id="sw-mm">00</span>:<span id="sw-ss">00</span><span class="sw-ms">.<span id="sw-cs">00</span></span>
    </div>
    <div class="sw-buttons">
      <button class="btn btn-start" id="btn-toggle">Start</button>
      <button class="btn btn-reset" id="btn-reset">Reset</button>
    </div>
  </div>

  <div class="sun"></div>
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>

  <div class="ground-strip"></div>
  <div class="ground-line"></div>

  <!-- Scrolling ground objects -->
  <div class="scroll-obj obj1" style="bottom:40%">
    <div class="rock"></div>
  </div>
  <div class="scroll-obj obj2" style="bottom:40%">
    <div class="flower-stem"><div class="flower-head"></div></div>
  </div>
  <div class="scroll-obj obj3" style="bottom:40%">
    <div class="rock" style="width:12px;height:8px;background:#aaa;"></div>
  </div>
  <div class="scroll-obj obj4" style="bottom:40%">
    <div class="flower-stem" style="height:28px;"><div class="flower-head" style="background:#FF8C00;"></div></div>
  </div>

  <div class="shadow"></div>

  <!-- Character SVG -->
  <div class="character">
    <svg class="char-svg" viewBox="0 0 80 140" xmlns="http://www.w3.org/2000/svg">

      <!-- Left arm (back) -->
      <g class="arm-left">
        <line x1="40" y1="58" x2="20" y2="80" stroke="#F4A460" stroke-width="7" stroke-linecap="round"/>
        <!-- fist -->
        <circle cx="20" cy="80" r="5" fill="#F4A460"/>
      </g>

      <!-- Left leg (back) -->
      <g class="leg-left">
        <!-- thigh -->
        <line x1="40" y1="82" x2="30" y2="105" stroke="#4169E1" stroke-width="8" stroke-linecap="round"/>
        <!-- shin -->
        <line x1="30" y1="105" x2="22" y2="128" stroke="#4169E1" stroke-width="7" stroke-linecap="round"/>
        <!-- shoe -->
        <ellipse cx="18" cy="130" rx="10" ry="5" fill="#222"/>
      </g>

      <!-- Body / torso -->
      <rect x="28" y="55" width="24" height="32" rx="8" fill="#FF6347"/>

      <!-- Head -->
      <circle cx="40" cy="38" r="20" fill="#F4A460"/>
      <!-- Hair -->
      <path d="M22,30 Q40,10 58,30 Q55,18 40,15 Q25,18 22,30Z" fill="#4a2800"/>
      <!-- Eyes -->
      <circle cx="33" cy="35" r="4" fill="white"/>
      <circle cx="47" cy="35" r="4" fill="white"/>
      <circle cx="34" cy="36" r="2.5" fill="#222"/>
      <circle cx="48" cy="36" r="2.5" fill="#222"/>
      <!-- Pupils shine -->
      <circle cx="35" cy="35" r="1" fill="white"/>
      <circle cx="49" cy="35" r="1" fill="white"/>
      <!-- Smile -->
      <path d="M33,44 Q40,50 47,44" stroke="#a0522d" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- Rosy cheeks -->
      <circle cx="28" cy="43" r="4" fill="rgba(255,100,100,0.3)"/>
      <circle cx="52" cy="43" r="4" fill="rgba(255,100,100,0.3)"/>
      <!-- Ear -->
      <ellipse cx="20" cy="38" rx="5" ry="7" fill="#F4A460"/>
      <ellipse cx="60" cy="38" rx="5" ry="7" fill="#F4A460"/>

      <!-- Right leg (front) -->
      <g class="leg-right">
        <line x1="40" y1="82" x2="50" y2="105" stroke="#2850C8" stroke-width="8" stroke-linecap="round"/>
        <line x1="50" y1="105" x2="58" y2="128" stroke="#2850C8" stroke-width="7" stroke-linecap="round"/>
        <ellipse cx="62" cy="130" rx="10" ry="5" fill="#111"/>
      </g>

      <!-- Right arm (front) -->
      <g class="arm-right">
        <line x1="40" y1="58" x2="60" y2="80" stroke="#E8956D" stroke-width="7" stroke-linecap="round"/>
        <circle cx="60" cy="80" r="5" fill="#E8956D"/>
      </g>

      <!-- Shorts highlight -->
      <rect x="28" y="72" width="24" height="16" rx="4" fill="rgba(0,0,0,0.1)"/>
    </svg>
  </div>

  <!-- Dust puffs -->
  <div class="dust">
    <div class="puff"></div>
    <div class="puff"></div>
    <div class="puff"></div>
  </div>
</div>

<script>
  const scene      = document.getElementById('scene');
  const swMM       = document.getElementById('sw-mm');
  const swSS       = document.getElementById('sw-ss');
  const swCS       = document.getElementById('sw-cs');
  const scoreEl    = document.getElementById('score');
  const jumpsEl    = document.getElementById('jumps');
  const bestEl     = document.getElementById('best');
  const btnToggle  = document.getElementById('btn-toggle');
  const btnReset   = document.getElementById('btn-reset');

  let running   = false;
  let startTime = 0;
  let elapsed   = 0;   // ms accumulated before last pause
  let rafId     = null;

  let score     = 0;
  let jumps     = 0;
  let best      = 0;
  let lastScoreTick = 0;  // timestamp of last score increment

  // Jump tracking — character animation is 2s; count a jump each cycle
  const JUMP_PERIOD = 2000;
  let jumpCount = 0;
  let animStart = null;

  function pad(n, d = 2) { return String(n).padStart(d, '0'); }

  function updateDisplay(ms) {
    const total = Math.floor(ms);
    const mm  = Math.floor(total / 60000);
    const ss  = Math.floor((total % 60000) / 1000);
    const cs  = Math.floor((total % 1000) / 10);
    swMM.textContent = pad(mm);
    swSS.textContent = pad(ss);
    swCS.textContent = pad(cs);
  }

  function tick(now) {
    if (!running) return;

    const ms = elapsed + (now - startTime);
    updateDisplay(ms);

    // Score: +1 per 100 ms while running
    if (now - lastScoreTick >= 100) {
      const ticks = Math.floor((now - lastScoreTick) / 100);
      score += ticks;
      lastScoreTick += ticks * 100;
      scoreEl.textContent = score;
      if (score > best) { best = score; bestEl.textContent = best; }
    }

    // Jump count: one jump per JUMP_PERIOD
    if (animStart === null) animStart = now;
    const newJumpCount = Math.floor((now - animStart) / JUMP_PERIOD);
    if (newJumpCount > jumpCount) {
      const diff = newJumpCount - jumpCount;
      jumpCount = newJumpCount;
      jumps += diff;
      jumpsEl.textContent = jumps;
      // Bonus score per jump
      score += diff * 5;
      scoreEl.textContent = score;
      if (score > best) { best = score; bestEl.textContent = best; }
    }

    rafId = requestAnimationFrame(tick);
  }

  function start() {
    running   = true;
    startTime = performance.now();
    lastScoreTick = startTime;
    if (animStart === null) animStart = startTime;
    scene.classList.remove('paused');
    btnToggle.textContent = 'Stop';
    btnToggle.className = 'btn btn-stop';
    rafId = requestAnimationFrame(tick);
  }

  function stop() {
    running  = false;
    elapsed += performance.now() - startTime;
    cancelAnimationFrame(rafId);
    scene.classList.add('paused');
    btnToggle.textContent = 'Start';
    btnToggle.className = 'btn btn-start';
  }

  function reset() {
    stop();
    elapsed    = 0;
    score      = 0;
    jumps      = 0;
    jumpCount  = 0;
    animStart  = null;
    lastScoreTick = 0;
    updateDisplay(0);
    scoreEl.textContent = '0';
    jumpsEl.textContent = '0';
    // best persists across resets
  }

  btnToggle.addEventListener('click', () => { running ? stop() : start(); });
  btnReset.addEventListener('click', reset);

  // Start automatically on load
  start();
</script>
</body>
</html>
